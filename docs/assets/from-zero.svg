<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="860" height="490" rx="10" fill="#1e1e2e"/>
<rect width="860" height="32" rx="10" fill="#313244"/>
<circle cx="20" cy="16" r="6" fill="#f38ba8"/><circle cx="42" cy="16" r="6" fill="#f9e2af"/><circle cx="64" cy="16" r="6" fill="#a6e3a1"/>
<text x="88" y="21" fill="#cdd6f4" font-size="13">bash — setting up internify</text>
<style>
.prompt{fill:#89dceb;font-weight:600}
.cmd{fill:#cdd6f4}
.out{fill:#a6adc8}
.ok{fill:#a6e3a1}
.block{fill:#f38ba8}
.dim{fill:#6c7086}
</style>
<text x="20" y="52" class="prompt">$ mkdir my-workspace &amp;&amp; cd my-workspace</text>
<text x="20" y="74" class="out"></text>
<text x="20" y="96" class="dim"># 1. clone your project and the tool, side by side</text>
<text x="20" y="118" class="cmd">$ git clone git@github.com:you/my-project.git</text>
<text x="20" y="140" class="cmd">$ git clone git@github.com:ajihairi/internify-ai.git</text>
<text x="20" y="162" class="out"></text>
<text x="20" y="184" class="dim"># 2. scaffold the knowledge dir from the template</text>
<text x="20" y="206" class="cmd">$ cp -r internify-ai/template/.intern  .intern</text>
<text x="20" y="228" class="cmd">$ cp    internify-ai/template/AGENTS.md AGENTS.md</text>
<text x="20" y="250" class="out"></text>
<text x="20" y="272" class="dim"># 3. install the opencode adapter's deps</text>
<text x="20" y="294" class="cmd">$ (cd internify-ai/adapters/opencode &amp;&amp; bun install)</text>
<text x="20" y="316" class="out">30 packages installed [2.89s]</text>
<text x="20" y="338" class="out"></text>
<text x="20" y="360" class="dim"># 4. point opencode at the adapter plugin</text>
<text x="20" y="382" class="cmd">$ cat opencode.json</text>
<text x="20" y="404" class="ok">{ "plugin": ["./internify-ai/adapters/opencode/plugins/intern-harness.ts"] }</text>
<text x="20" y="426" class="out"></text>
<text x="20" y="448" class="dim"># 5. restart opencode, then start a session</text>
</svg>