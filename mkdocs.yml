site_name: internify
site_description: A disk-backed engineer loop for AI agents — context on disk, layered gates, no hallucination.
site_url: https://ajihairi.github.io/internify-ai/
repo_url: https://github.com/ajihairi/internify-ai
repo_name: ajihairi/internify-ai
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-square.png
  favicon: assets/logo-square.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - User guide: user-guide.md
  - Getting started:
      - Install: getting-started/install.md
      - Quick start: getting-started/quickstart.md
      - Walkthrough: walkthrough.md
  - Slash commands: commands.md
  - CLI: cli.md
  - Providers: providers.md
  - Workspace & config: workspace.md
  - Specs: spec.md
  - Project context (scan): scan.md
  - Code knowledge (learn): learn.md
  - Multi-active tasks: multitask.md
  - Contract: contract.md
  - Architecture: DESIGN.md
  - Structure profiles: structure.md
  - Skills: skills.md
  - Articles:
      - "01 — What we built": articles/01-what-we-built.md
      - "02 — Portability": articles/02-portability.md
      - "03 — Publishing": articles/03-publishing.md
      - "04 — Workspace model": articles/04-internify-workspace.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]

plugins:
  - search
